<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}Raise Labs Learning - The Employability Platform{% endblock %}</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#faf9f5",
                        "on-secondary-fixed": "#091d2e",
                        "secondary-fixed-dim": "#b5c8df",
                        "on-tertiary-fixed-variant": "#544600",
                        "surface-container-highest": "#e3e2df",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dbdad6",
                        "inverse-on-surface": "#f2f1ed",
                        "background": "#faf9f5",
                        "on-primary-fixed-variant": "#384669",
                        "surface-container-high": "#e9e8e4",
                        "on-surface": "#1b1c1a",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#45464e",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#4c3f00",
                        "on-primary-container": "#7583aa",
                        "outline": "#75777f",
                        "tertiary-container": "#c9a900",
                        "tertiary": "#705d00",
                        "outline-variant": "#c5c6cf",
                        "tertiary-fixed-dim": "#e9c400",
                        "secondary-fixed": "#d1e4fb",
                        "inverse-surface": "#2f312e",
                        "secondary": "#4e6073",
                        "on-primary-fixed": "#0a1a3b",
                        "error-container": "#ffdad6",
                        "secondary-container": "#cfe2f9",
                        "on-secondary-container": "#526478",
                        "on-background": "#1b1c1a",
                        "primary": "#000000",
                        "error": "#ba1a1a",
                        "primary-container": "#0a1a3b",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#b8c6f0",
                        "tertiary-fixed": "#ffe16d",
                        "surface-container-low": "#f4f4f0",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e3e2df",
                        "surface-tint": "#505e82",
                        "on-secondary-fixed-variant": "#36485b",
                        "primary-fixed-dim": "#b8c6f0",
                        "surface": "#faf9f5",
                        "surface-container": "#efeeea",
                        "primary-fixed": "#dae2ff",
                        "on-tertiary-fixed": "#221b00",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "margin-desktop": "40px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "container-max": "1200px",
                        "margin-mobile": "16px",
                        "section-gap": "80px",
                        "unit": "8px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Lexend"],
                        "headline-md": ["Lexend"],
                        "body-lg": ["Lexend"],
                        "display-lg": ["Lexend"],
                        "label-md": ["Lexend"],
                        "body-md": ["Lexend"],
                        "label-sm": ["Lexend"],
                        "display-lg-mobile": ["Lexend"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                        "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
                    }
                }
            }
        };
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        .shell-shadow {
            box-shadow: 0 4px 20px -2px rgba(10, 26, 59, 0.05);
        }
        .shell-shadow-top {
            box-shadow: 0 -4px 20px -2px rgba(10, 26, 59, 0.05);
        }
        .card-level-1 {
            background-color: #ffffff;
            border: 1px solid #c5c6cf;
            transition: all 0.2s ease;
        }
        .card-level-2 {
            background-color: #ffffff;
            border: 1px solid #c5c6cf;
            box-shadow: 0 4px 12px rgba(10, 26, 59, 0.02);
        }
        .card-hover:hover {
            box-shadow: 0 8px 24px rgba(10, 26, 59, 0.04);
            transform: translateY(-2px);
        }
        
        /* Fade-in animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Navy and Yellow highlighting colors */
        .color-accent-navy { color: #0a1a3b; }
        .bg-accent-navy { background-color: #0a1a3b; }
        .color-accent-yellow { color: #ffe16d; }
        .bg-accent-yellow { background-color: #ffe16d; }

        /* Stylish Buttons */
        .btn-stylish {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-stylish:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 6px 20px rgba(10, 26, 59, 0.15);
        }
        .btn-stylish:active {
            transform: translateY(0);
            scale: 0.97;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface-bright text-on-surface antialiased min-h-screen flex flex-col selection:bg-secondary-container selection:text-on-secondary-container">
    {% block body %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
